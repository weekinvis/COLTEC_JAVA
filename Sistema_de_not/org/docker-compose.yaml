version: '3'

services:

  db:
    image: mysql:latest
    container_name: sistema_notas_db
    environment:
      MYSQL_ROOT_PASSWORD: senhaSuperSegura
      MYSQL_DATABASE: SistemaNotas
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./script.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rede-notas
    restart: always


  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - '8080:80'
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: senhaSuperSegura
    networks:
      - rede-notas
    restart: always

volumes:
  db_data:

networks:
  rede-notas: